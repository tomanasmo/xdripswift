name: Validate Xcode 27

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/validate_xcode_27.yml'
      - '.github/workflows/build_xdrip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Unsigned iOS Release build
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify Xcode and iOS SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk_version"
          [[ ${sdk_version%%.*} == 27 ]]

      - name: Build xDrip
        run: |
          xcodebuild -project xdrip.xcodeproj -scheme xdrip \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
